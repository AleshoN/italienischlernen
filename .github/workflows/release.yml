name: Geprüftes Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version ohne führendes v, zum Beispiel 1.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run lint
      - run: pnpm run format:check
      - run: pnpm run build
      - run: pnpm run release:verify
      - name: Releasepaket erstellen
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          zip -r "piano-italienisch-${VERSION}.zip" \
            .github public scripts src \
            CHANGELOG.md OPEN_DATA.md README.md RELEASE_NOTES_1.0.0.md TESTS.md \
            eslint.config.js index.html package.json pnpm-lock.yaml \
            tsconfig.app.json tsconfig.json tsconfig.node.json vite.config.ts \
            dist
      - name: GitHub Release veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: >-
          gh release create "v${VERSION}"
          "piano-italienisch-${VERSION}.zip"
          --target main
          --title "Piano ${VERSION}"
          --notes-file RELEASE_NOTES_1.0.0.md
